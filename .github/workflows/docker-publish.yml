name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  # Per-ref group: rapid pushes to the same branch supersede, but tag builds
  # (each its own ref) are never cancelled by a branch push.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Wazuh MCP Server
            org.opencontainers.image.description=MCP-compliant remote server for Wazuh SIEM integration
            org.opencontainers.image.licenses=MIT

      # OCI image references must be lowercase, but github.repository (IMAGE_NAME) is
      # mixed-case (Wazuh-MCP-Server). Compute a lowercase name once and reuse it for the
      # local scan tag (metadata-action already lowercases the push tags below).
      - name: Compute lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # Pre-push gate — build a single-arch (amd64) image and LOAD it into the local Docker
      # daemon so it can be scanned before anything is published. `load: true` cannot handle
      # a multi-arch manifest, hence single platform here; the multi-arch push below reuses
      # the same gha build cache, so amd64 layers are not rebuilt.
      - name: Build image for scanning (single-arch, load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:scan-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BLOCKING scan of the loaded image. exit-code 1 on fixable HIGH/CRITICAL fails the
      # job here, before the push step runs — so a vulnerable image is never published.
      - name: Scan image for vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:scan-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Only reached if the scan passed. Multi-arch build + push, reusing the cache from the
      # scan build above (amd64 comes from cache; arm64 is built here).
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
