name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 3.0.0)'
        required: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.check.outputs.dockerhub }}
      pypi: ${{ steps.check.outputs.pypi }}
    steps:
      - id: check
        # Optional publish targets are gated on their secrets so the release stays green
        # when they aren't configured (the GHCR image is published by docker-publish.yml).
        env:
          DOCKERHUB: ${{ secrets.DOCKER_USERNAME }}
          PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB" ]; then echo "dockerhub=true" >> "$GITHUB_OUTPUT"; else echo "dockerhub=false" >> "$GITHUB_OUTPUT"; echo "::notice::DOCKER_USERNAME not set — skipping Docker Hub publish"; fi
          if [ -n "$PYPI" ]; then echo "pypi=true" >> "$GITHUB_OUTPUT"; else echo "pypi=false" >> "$GITHUB_OUTPUT"; echo "::notice::PYPI_API_TOKEN not set — skipping PyPI publish"; fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -e .

    - name: Verify tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        TAG_VER="${TAG#v}"
        PKG_VER="$(python -c 'import importlib.metadata as m; print(m.version("wazuh-mcp-server"))')"
        INIT_VER="$(python -c 'import wazuh_mcp_server; print(wazuh_mcp_server.__version__)')"
        echo "tag=$TAG_VER  pyproject=$PKG_VER  __init__=$INIT_VER"
        if [ "$TAG_VER" != "$PKG_VER" ] || [ "$TAG_VER" != "$INIT_VER" ]; then
          echo "::error::Tag ($TAG_VER) does not match package version ($PKG_VER) / __version__ ($INIT_VER)"
          exit 1
        fi

    - name: Run tests
      run: |
        pip install pytest pytest-asyncio pytest-cov
        pytest tests/ -v --cov=src/wazuh_mcp_server --cov-fail-under=37
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-packages
        path: dist/

  docker-release:
    name: Docker Release (Docker Hub)
    runs-on: ubuntu-latest
    needs: [build-and-test, preflight]
    if: startsWith(github.ref, 'refs/tags/') && needs.preflight.outputs.dockerhub == 'true'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.event_name != 'workflow_dispatch'
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          gensecai/wazuh-mcp-server
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'workflow_dispatch' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-packages
        path: dist/
    
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Generate release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        {
          echo "# Wazuh MCP Server ${VERSION}"
          echo
          echo "## Changelog"
          # Extract the section for this version from CHANGELOG.md (up to the next '## [' heading).
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md || true
          echo
          echo "Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          echo
          echo "## Installation"
          echo '```bash'
          echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
          echo '```'
          echo "Or build from source — see the [README](https://github.com/${{ github.repository }}#quick-start)."
        } > RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: dist/*
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-and-test, create-release, preflight]
    if: startsWith(github.ref, 'refs/tags/') && needs.preflight.outputs.pypi == 'true'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-packages
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
