name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 3.0.0)'
        required: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        # Install with the [gcf] extra so the release gate exercises the same test set as CI
        # (the GCF tests self-skip without it, making a tag build test less than main).
        pip install -e ".[gcf]"

    - name: Verify tag matches package version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        TAG_VER="${TAG#v}"
        PKG_VER="$(python -c 'import importlib.metadata as m; print(m.version("wazuh-mcp-server"))')"
        INIT_VER="$(python -c 'import wazuh_mcp_server; print(wazuh_mcp_server.__version__)')"
        echo "tag=$TAG_VER  pyproject=$PKG_VER  __init__=$INIT_VER"
        if [ "$TAG_VER" != "$PKG_VER" ] || [ "$TAG_VER" != "$INIT_VER" ]; then
          echo "::error::Tag ($TAG_VER) does not match package version ($PKG_VER) / __version__ ($INIT_VER)"
          exit 1
        fi

    - name: Run tests
      run: |
        pip install pytest pytest-asyncio pytest-cov
        pytest tests/ -v --cov=src/wazuh_mcp_server --cov-fail-under=37
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-packages
        path: dist/

  # Container images are published to GHCR by docker-publish.yml (the documented
  # registry) on every tag — no separate Docker Hub job / secrets needed here.

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-packages
        path: dist/
    
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Generate release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        {
          echo "# Wazuh MCP Server ${VERSION}"
          echo
          echo "## Changelog"
          # Extract the section for this version from CHANGELOG.md (up to the next '## [' heading).
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md || true
          echo
          echo "Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          echo
          echo "## Installation"
          echo '```bash'
          echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
          echo '```'
          echo "Or build from source — see the [README](https://github.com/${{ github.repository }}#quick-start)."
        } > RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: RELEASE_NOTES.md
        files: dist/*
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-and-test, create-release]
    # Opt-in: set the repository variable PUBLISH_PYPI=true once you've configured a
    # PyPI trusted publisher for this workflow (no stored token needed — uses OIDC).
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_PYPI == 'true'
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-packages
        path: dist/

    - name: Publish to PyPI (trusted publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
