name: CI

on:
  push:
    branches: [ main, feature/*, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow manual re-runs (e.g. to re-validate after a runner outage)

# Cancel superseded runs on the same ref so rapid pushes don't pile up in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort

    - name: Check formatting with black
      run: black --check --diff src/ tests/

    - name: Check imports with isort
      run: isort --check-only --diff src/ tests/

    - name: Lint with ruff
      run: ruff check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    # Test the full supported range (pyproject requires-python = ">=3.11"), not just 3.13,
    # so a version-specific regression is caught instead of shipping silently.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gcf]"
        pip install pytest pytest-asyncio pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src/wazuh_mcp_server --cov-report=xml --cov-fail-under=37

    - name: Upload coverage
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Check Python syntax
      run: |
        python -m py_compile src/wazuh_mcp_server/*.py
        python -m py_compile src/wazuh_mcp_server/api/*.py
        echo "All Python files have valid syntax"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, syntax-check]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 5
