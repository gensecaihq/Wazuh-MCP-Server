name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/Dockerfile'
      - '**/*.py'

# Cancel superseded runs on the same ref so rapid pushes don't pile up in the queue.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit
      # Note: semgrep is used via semgrep/semgrep-action, not pip.
      # safety was dropped: its 3.x CLI changed output flags and requires an
      # account for scans; pip-audit covers dependency CVEs via the PyPA database.

    - name: Install project dependencies
      run: pip install -e .

    - name: Run pip-audit
      continue-on-error: false
      run: |
        pip-audit --skip-editable --format json --output pip-audit-report.json
        if [ -f pip-audit-report.json ]; then
          echo "### Pip Audit Report" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat pip-audit-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: dependency-security-reports
        path: pip-audit-report.json
      if: always()

  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Run Bandit
      continue-on-error: false
      run: |
        pip install "bandit[toml]"
        bandit -c pyproject.toml -r src/ -f json -o bandit-report.json
        echo "### Bandit Security Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        bandit -c pyproject.toml -r src/ -f txt
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Run Semgrep
      # semgrep/semgrep-action is archived/deprecated; run the maintained CLI instead.
      run: |
        pip install semgrep
        semgrep --config auto --error --sarif --output semgrep.sarif src/
      continue-on-error: false
    
    - name: Upload code security reports
      uses: actions/upload-artifact@v7
      with:
        name: code-security-reports
        path: bandit-report.json
      if: always()

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mcp-remote'
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: false
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()
    
    - name: Dockerfile linting
      uses: hadolint/hadolint-action@v3.4.0
      with:
        dockerfile: Dockerfile
        format: json
        output-file: hadolint-report.json
      continue-on-error: false
    
    - name: Upload Docker security reports
      uses: actions/upload-artifact@v7
      with:
        name: docker-security-reports
        path: |
          trivy-results.sarif
          hadolint-report.json
      if: always()

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      # Only on push/PR, where a commit range exists. On schedule / workflow_dispatch
      # there is no diff (BASE == HEAD) and the action errors out; gitleaks below scans
      # the full git history on every event, so secret coverage is maintained.
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@v3.96.0
      with:
        path: ./
        extra_args: --only-verified
      continue-on-error: false

    - name: Gitleaks (manual)
      env:
        # Pin the version and verify the download against a known SHA-256 so a
        # compromised/altered release artifact can't be silently executed in CI.
        GITLEAKS_VERSION: "8.28.0"
        GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
      run: |
        set -euo pipefail
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        curl -fsSL -o "$archive" "$url"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive"
        ./gitleaks detect --source . --verbose --report-path gitleaks-report.json
        echo "### Gitleaks Report" >> $GITHUB_STEP_SUMMARY
        if [ -f gitleaks-report.json ]; then
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat gitleaks-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "No secrets detected" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: false
