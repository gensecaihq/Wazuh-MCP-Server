# Wazuh MCP Remote Server - Docker Compose v2 Latest
# MCP-compliant remote server with production-grade configuration
# Branch: main - Production-ready remote MCP server
# Uses Docker Compose v2 latest format with compose.yml naming convention

name: wazuh-main-server

services:
  wazuh-main-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
        VERSION: ${VERSION:-4.3.0}
      target: production

    image: wazuh-main-server:${VERSION:-4.3.0}
    container_name: wazuh-main-server
    hostname: wazuh-main-server
    
    restart: unless-stopped
    # No `init: true`: the image's ENTRYPOINT is already tini
    
    env_file: 
      - .env
    environment:
      # Runtime overrides
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      ENVIRONMENT: production
      # Authentication mode: oauth (recommended), bearer (default), none (dev only)
      AUTH_MODE: ${AUTH_MODE:-bearer}
      
    ports:
      # Bind to loopback by default: the server serves plain HTTP and expects a TLS-
      # terminating reverse proxy in front. Set MCP_BIND=0.0.0.0 to expose it directly
      # (only behind a trusted network/firewall).
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-3000}:3000"
    
    # The app always listens on 3000 in the container (MCP_PORT is pinned above; the host
    # side is the ports mapping). Interpolating ${MCP_PORT} here used the HOST value, so a
    # custom port left the container permanently unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:3000/health | jq -e '.status == \"healthy\"' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
      
    # Resource management
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    
    # Multi-cluster topology (config/clusters.json) — without this mount the file
    # MULTI_CLUSTER.md describes was never visible to the container
    volumes:
      - ./config:/app/config:ro

    # Writable directories
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/logs:noexec,nosuid,size=128m
    
    # Structured logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=wazuh-main-server"
    
    # Service labels
    labels:
      - "com.docker.compose.service=wazuh-main-server"
      - "org.opencontainers.image.title=Wazuh MCP Remote Server"
      - "org.opencontainers.image.description=MCP-compliant remote server for Wazuh SIEM (main branch)"
      - "monitoring.prometheus.scrape=true"
      - "monitoring.prometheus.port=3000"
      - "monitoring.prometheus.path=/metrics"
      - "branch=main"